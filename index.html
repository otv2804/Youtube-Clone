<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube  </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabeçalho">
        <div class="cabeçalho_Inicio"> 
            <i class="fa-solid fa-bars"></i>
            <div class="logotipos">
                <i class="fa-brands fa-youtube logotipo_icon"></i>
                <p class="logotipo_Nome">Youtube</p>
                <p class="logotipo_pais">BR</p>
            </div>
        </div>
        <div class="cabeçalho_Meio"> 
            <div class="search">
                <input type="text" name="search" id="search_Input" class="search_Input">
                <button class="search_Button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <button class="microfone">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>
        <div class="cabeçalho_Final"> 
            <button class="logotipo_Video" title="Criar">
                <i class="fa-solid fa-video" > </i>
            </button>
            <button class="logotipo_Video" title="notificações">
                <i class="fa-solid fa-bell"></i>
            </button>
            <button class="logotipo_Video" title="Sua conta">
                v
            </button>
        </div>
    </header>

    <script src="script.js"></script>
</body>
</html>
